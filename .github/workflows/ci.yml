name: Sentinel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust-tests:
    name: Rust Crates Check & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check --workspace
        env:
          CARGO_INCREMENTAL: "0"

      - name: Run Tests (sentinel-policy)
        run: cargo test -p sentinel-policy --verbose

      - name: Run Tests (sentinel-core)
        run: cargo test -p sentinel-core --verbose

      - name: Run Tests (sentinel-exec)
        run: cargo test -p sentinel-exec --verbose

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and Build
        working-directory: frontend
        run: npm run build
